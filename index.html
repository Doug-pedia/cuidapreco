<!DOCTYPE html>
<!-- V1.7.3 - Acompanha Preço (Scanner otimizado e URL oculta/protegida) -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanha Preço - Compras Inteligentes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        #reader video {
            object-fit: cover !important;
            border-radius: 0.75rem;
            max-height: 200px !important;
        }
        #reader {
            width: 100% !important;
            border: none !important;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col font-sans pb-20 md:pb-0">

    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-cart-shopping text-2xl text-amber-300"></i>
                <h1 class="text-xl font-bold tracking-wide">Acompanha Preço</h1>
            </div>
            <div class="text-xs bg-blue-700 px-3 py-1.5 rounded-full font-medium">
                v1.7.3 - GitHub Pages
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full flex-1 p-4 space-y-6">

        <div class="flex bg-white p-1 rounded-xl shadow-sm border border-gray-200">
            <button id="tab-carrinho" onclick="switchTab('carrinho')" class="flex-1 py-2.5 rounded-lg font-semibold text-sm transition-all flex items-center justify-center gap-2 bg-blue-600 text-white shadow-sm">
                <i class="fa-solid fa-basket-shopping"></i>
                <span>Carrinho</span>
            </button>
            <button id="tab-scanner" onclick="switchTab('scanner')" class="flex-1 py-2.5 rounded-lg font-semibold text-sm transition-all flex items-center justify-center gap-2 text-gray-600 hover:text-blue-600">
                <i class="fa-solid fa-barcode"></i>
                <span>Scanner</span>
            </button>
            <button id="tab-config" onclick="switchTab('config')" class="flex-1 py-2.5 rounded-lg font-semibold text-sm transition-all flex items-center justify-center gap-2 text-gray-600 hover:text-blue-600">
                <i class="fa-solid fa-gear"></i>
                <span>Planilha</span>
            </button>
        </div>

        <section id="sec-carrinho" class="space-y-4">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 space-y-3">
                <div class="flex justify-between items-center">
                    <div>
                        <span class="text-xs text-gray-500 font-semibold uppercase tracking-wider">Total</span>
                        <div class="text-3xl font-extrabold text-gray-900" id="cart-total-display">R$ 0,00</div>
                    </div>
                    <div class="text-right">
                        <label for="budget-input" class="text-xs text-gray-500 font-semibold uppercase tracking-wider block">Orçamento</label>
                        <div class="flex items-center gap-1 justify-end">
                            <span class="text-gray-500 font-medium text-sm">R$</span>
                            <input type="number" id="budget-input" value="150" onchange="updateBudget()" class="w-24 text-right font-bold text-gray-800 border rounded-lg px-2 py-1 text-sm outline-none">
                        </div>
                    </div>
                </div>
                <div class="space-y-1">
                    <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                        <div id="budget-bar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between text-xs text-gray-500" id="budget-status">
                        <span>0%</span>
                        <span>Restante: R$ 150,00</span>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
                <h2 class="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-plus text-blue-600"></i> Adicionar Item
                </h2>
                <div class="grid grid-cols-12 gap-2">
                    <div class="col-span-12 sm:col-span-5 relative">
                        <input type="text" id="prod-name" placeholder="Produto" class="w-full border rounded-lg pl-3 pr-10 py-2 text-sm outline-none">
                        <button onclick="quickScanForAdd()" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-blue-600 p-1">
                            <i class="fa-solid fa-camera text-base"></i>
                        </button>
                    </div>
                    <div class="col-span-6 sm:col-span-3">
                        <input type="number" step="0.01" id="prod-price" placeholder="Preço (R$)" class="w-full border rounded-lg px-3 py-2 text-sm outline-none">
                    </div>
                    <div class="col-span-3 sm:col-span-2">
                        <input type="number" id="prod-qty" value="1" min="1" class="w-full border rounded-lg px-3 py-2 text-sm outline-none">
                    </div>
                    <div class="col-span-3 sm:col-span-2">
                        <button onclick="addManualProduct()" class="w-full bg-blue-600 text-white rounded-lg py-2 font-bold hover:bg-blue-700 transition text-sm">Add</button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="px-4 py-3 border-b bg-gray-50 flex justify-between items-center">
                    <h3 class="font-bold text-sm text-gray-700">Lista (<span id="cart-count">0</span>)</h3>
                    <button onclick="clearCart()" class="text-xs text-red-600 hover:underline">Limpar</button>
                </div>
                <ul id="cart-list" class="divide-y divide-gray-100">
                    <li class="p-6 text-center text-gray-400 text-sm">Carrinho vazio.</li>
                </ul>
            </div>
        </section>

        <section id="sec-scanner" class="space-y-4 hidden">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 space-y-4">
                <div class="text-center">
                    <h2 class="text-base font-bold text-gray-800">Scanner de Código de Barras</h2>
                    <p class="text-xs text-gray-500">Aponte a câmera para o código de barras.</p>
                </div>

                <div class="relative max-w-xs mx-auto overflow-hidden rounded-xl border-2 border-blue-500 bg-black min-h-[180px] max-h-[200px] flex items-center justify-center">
                    <div id="reader" class="w-full"></div>
                </div>

                <div class="flex justify-center gap-3">
                    <button id="btn-start-cam" onclick="startCamera()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow flex items-center gap-2">
                        <i class="fa-solid fa-video"></i> Abrir Câmera
                    </button>
